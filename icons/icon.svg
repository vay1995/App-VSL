<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070913" />
    </linearGradient>

    <!-- Accent Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Symbol Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Radial Glow Filter -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle Glow Sphere -->
  <circle cx="256" cy="256" r="210" fill="url(#centerGlow)" />

  <!-- Outer Border Stroke -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="none" stroke="url(#borderGrad)" stroke-width="8" stroke-opacity="0.6" />

  <!-- Mathematical Accent Symbols (Watermarks) -->
  <text x="96" y="140" font-family="'Outfit', sans-serif" font-size="56" fill="#818cf8" fill-opacity="0.3" font-weight="700">∫</text>
  <text x="390" y="140" font-family="'Outfit', sans-serif" font-size="44" fill="#38bdf8" fill-opacity="0.3" font-weight="700">π</text>
  <text x="80" y="420" font-family="'Outfit', sans-serif" font-size="40" fill="#a855f7" fill-opacity="0.25" font-weight="700">x²</text>
  <text x="380" y="420" font-family="'Outfit', sans-serif" font-size="42" fill="#fbbf24" fill-opacity="0.25" font-weight="700">√</text>

  <!-- Center Prominent Summation Sigma (∑) with Glow -->
  <g filter="url(#glow)">
    <path d="M 170,165 
             L 342,165 
             L 342,205 
             L 245,205 
             L 295,256 
             L 245,307 
             L 342,307 
             L 342,347 
             L 170,347 
             L 170,315 
             L 242,256 
             L 170,197 Z" 
          fill="url(#goldGrad)" 
          stroke="#fff" 
          stroke-width="3" 
          stroke-opacity="0.8" />
  </g>

  <!-- Khmer Accent Subtitle Badge -->
  <rect x="156" y="380" width="200" height="38" rx="19" fill="rgba(99, 102, 241, 0.25)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />
  <text x="256" y="405" font-family="'Kantumruy Pro', 'Battambang', sans-serif" font-size="18" fill="#f8fafc" font-weight="600" text-anchor="middle" letter-spacing="1">គណិតវិទ្យា</text>
</svg>
